name: Build ShadowLook APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowLook-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
      - name: Create Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0-${{ github.run_number }}
          name: ShadowLook v1.0 Build ${{ github.run_number }}
          body: |
            🚀 ShadowLook APK - AI Face Recognition App
            - Cyber theme #0B0E14 + #00F0FF + #FF0055 + #00FF66
            - 3 Screens: Live Recognition, Register, Database
            - Full Arabic RTL support
            - Direct APK download below
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
